<h1>Videos</h1>
{% for video in videos %}
    <div>
        <h3>{{ video.title }}</h3>
        <p>{{ video.description }}</p>
        <video width="400" controls data-preview="{{ video.preview_duration }}" data-video-id="{{video.id}}" data-has-access="{% if video.id in purchased_video_ids %} true{% else %} false{% endif %}">
            <source src="{{ video.video_file.url}} " type="video/mp4">
        </video>
        <p>Price: ${{ video.price }}</p>
        {% if video.id not in purchased_video_ids %}
            <a href="/pay/{{ video.id }}">Unlock Full Video</a>
        {% else %}
            <p style="color: green;">You own this video</p>
        {% endif %}
    </div>
    {% endfor %}

    <script>
        const videos = document.querySelectorAll("video");

        videos.forEach(video => {
            const previewTime = parseInt(video.dataset.preview);
            const hasAccess = video.dataset.hasAccess === "true";

            if (!hasAccess){
                video.addEventListener("timeupdate", () => {
                    if (video.currentTime >= previewTime){
                        video.pause();
                        alert("Preview finished. Please pay to unlock full video.");
                    }
                });
            }
        });
    </script>
