
{% load static %}
<link rel="stylesheet" href="{% static 'videos/style.css' %}">

<div class="container">
    <h1>{{ video.title }}</h1>
    {% if has_access %}
    <p class="unlocked">Full access unlocked</p>
    {% else %}
    <p class="locked">Preview only</p>
    {% endif %}

    <video width="100%" height="90%" controls style="border-radius:10px;">
    <source src="/stream/{{ video.id }}/" type="video/mp4"></video>
</div>
