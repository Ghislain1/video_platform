<h2>{{ video.title }}</h2>
<p>{{ video.description }}</p>

{% if has_access %}
  <p style="color:green;">✔ Full access unlocked</p>
{% else %}
  <p style="color:red;">🔒 Preview only (pay to unlock full video)</p>
{% endif %}

<video width="600" controls>
  <source src="/stream/{{ video.id }}/" type="video/mp4">
</video>

<p>Price: ${{ video.price }}</p>

{% if not has_access %}
  <a href="/pay/{{ video.id }}/">Unlock Full Video</a>
{% endif %}
